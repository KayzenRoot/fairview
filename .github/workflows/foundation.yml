name: Fairview foundation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  public-repo-security:
    name: Public repository security gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check every tracked source file, env path and CI privilege
        run: |
          node scripts/security-scan.mjs
          node --test tests/bootstrap/public-safety.test.mjs
  governed-harness:
    name: Source Pack and impact-driven harness
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Canonical source and security
        run: |
          node scripts/check-sources.mjs
          node scripts/security-scan.mjs
      - name: Local harness doctor
        run: node scripts/harness.mjs doctor
      - name: Impact-driven scoped proof (PR)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/harness.mjs verify --changed --base "$BASE_SHA" --head HEAD
      - name: Exact-head scoped Evidence Bundle
        if: github.event_name == 'pull_request'
        env:
          EVIDENCE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVIDENCE_TESTS_VERIFIED: '1'
        run: node scripts/evidence.mjs
      - name: Attach Evidence Bundle
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: fairview-bootstrap-evidence
          path: tmp/evidence/*.json
          if-no-files-found: error
      - name: Full active harness (protected main)
        if: github.event_name == 'push'
        run: node scripts/harness.mjs verify --all
  gef-upstream-release:
    name: Pinned GEF release validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Decide GEF proof by exact changed gitlink
        id: gef
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          test "$(git -C vendor/gef-bootstrap rev-parse HEAD)" = "866fe3af8cccc65c929aaf6a47a924401fa448b3"
          if [[ -n "$BASE_SHA" ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null && git diff --quiet "$BASE_SHA"...HEAD -- vendor/gef-bootstrap .gitmodules; then
            echo "run_full=false" >> "$GITHUB_OUTPUT"
            echo "GEF upstream gitlink unchanged: reuse pinned upstream release proof"
          else
            echo "run_full=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Pinned source-workspace test
        if: steps.gef.outputs.run_full == 'true'
        working-directory: vendor/gef-bootstrap
        run: |
          test "$(git rev-parse HEAD)" = "866fe3af8cccc65c929aaf6a47a924401fa448b3"
          npm ci
          npm run validate
          npm audit --audit-level=high
  windows-bootstrap-compat:
    name: Windows PowerShell parser and harness
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse PowerShell scripts without installing any service
        shell: pwsh
        run: |
          $files = @('scripts/local/setup-windows.ps1', 'scripts/local/check-hive.ps1', 'scripts/local/verify-checkpoint.ps1', 'scripts/local/check-hive-isolated.ps1', 'scripts/local/invoke-hive-smoke.ps1', 'tests/bootstrap/fixtures/smoke-switch-child.ps1')
          foreach ($file in $files) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { $errors | Out-String | Write-Error; exit 1 }
          }
      - name: Actual Windows PowerShell 5.1 child-switch and exit propagation regression
        shell: pwsh
        run: |
          $runner = (Resolve-Path 'scripts/local/invoke-hive-smoke.ps1').Path
          $fixture = (Resolve-Path 'tests/bootstrap/fixtures/smoke-switch-child.ps1').Path
          $off = & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $runner -SmokeScriptPath $fixture -BaseUrl http://127.0.0.1:18000 -ProjectRelativePath Fairview
          if ($LASTEXITCODE -ne 0 -or ($off -join "`n") -notmatch 'SEMANTIC_ABSENT') { throw 'PS51_ABSENT_SWITCH_REGRESSION' }
          $on = & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $runner -SmokeScriptPath $fixture -BaseUrl http://127.0.0.1:18000 -ProjectRelativePath Fairview -RequireSemantic
          if ($LASTEXITCODE -ne 0 -or ($on -join "`n") -notmatch 'SEMANTIC_PRESENT') { throw 'PS51_PRESENT_SWITCH_REGRESSION' }
          $oldPreference = $ErrorActionPreference
          try {
            $ErrorActionPreference = 'Continue'
            $failure = & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $runner -SmokeScriptPath $fixture -BaseUrl http://127.0.0.1:18999 -ProjectRelativePath Fairview 2>&1
            $failedExit = $LASTEXITCODE
          } finally { $ErrorActionPreference = $oldPreference }
          if ($failedExit -eq 0) { throw 'PS51_CHILD_FAILURE_NOT_PROPAGATED' }
      - name: Run source and deterministic tests
        run: |
          node scripts/check-sources.mjs
          node --test tests/bootstrap/impact.test.mjs tests/bootstrap/windows-contract.test.mjs tests/bootstrap/evidence-contract.test.mjs tests/bootstrap/source-fingerprint.test.mjs tests/bootstrap/git-diff.test.mjs tests/bootstrap/checkpoint-preflight.test.mjs tests/bootstrap/isolated-hive-contract.test.mjs tests/bootstrap/hive-compose-guard.test.mjs
